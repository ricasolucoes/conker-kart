name: Android Build CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK & NDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 11076708

    - name: Verify Kart Assets
      run: |
        echo "Verifying 3D Kart Assets..."
        ls -lh karts/conker/
        ls -lh karts/berri/
        ls -lh karts/panther/
        ls -lh assets/store/

    - name: Package Assets
      run: |
        mkdir -p build/dist
        tar -czvf build/dist/conker-kart-karts-bundle.tar.gz karts/
        zip -r build/dist/conker-kart-store-assets.zip assets/store/

    - name: Upload Karts and Store Assets Artifact
      uses: actions/upload-artifact@v4
      with:
        name: conker-kart-assets
        path: build/dist/
